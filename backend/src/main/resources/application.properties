spring.application.name=soul-up-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/soul_up?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

soulup.python.executable=${PYTHON_EXECUTABLE:python}
soulup.python.script-path=${PYTHON_SCRIPT_PATH:../ia-python/main.py}
soulup.video.upload-dir=${VIDEO_UPLOAD_DIR:uploads}
soulup.video.processing-timeout-seconds=${VIDEO_PROCESSING_TIMEOUT_SECONDS:120}
